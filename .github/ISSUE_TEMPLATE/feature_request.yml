name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/ROADMAP.md first — browser recording, annotations and size targeting are already planned.
        Proposals must keep the core principles: everything runs locally in the browser, no uploads, no accounts, no tracking.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This works without uploading video or adding a backend.
          required: true
