name: Release

# Creates a DRAFT GitHub Release for a version tag (vX.Y.Z) with the static site attached.
# Nothing is published automatically: a maintainer reviews the draft and publishes it by hand.
# No npm publishing, no deployment.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a draft release for (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # needed only to create the draft release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build reports the tagged version and commit
        run: node -e 'const v=require("./out/version.json"); const head=require("child_process").execSync("git rev-parse HEAD").toString().trim(); if ("v"+v.version!==process.env.TAG || v.commit!==head) { console.error(v, head); process.exit(1) }'

      - name: Package static site
        run: |
          name="screenbloom-${TAG}-static"
          cp -R out "$name"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found && !/^<!--/ { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            cat changelog-section.md
            echo
            echo "### Downloads"
            echo
            echo "- \`screenbloom-${TAG}-static.zip\` is the **static website build** for self-hosting (upload its contents to any HTTPS static host, see docs/SELF_HOSTING.md). It is not a desktop application or installer."
            echo "- \`screenbloom-${TAG}-static.zip.sha256\` is its SHA-256 checksum (\`sha256sum -c\`)."
            echo "- No download is needed to use ScreenBloom: https://screenbloom.storyweave.cloud"
          } > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            "screenbloom-${TAG}-static.zip" "screenbloom-${TAG}-static.zip.sha256"
