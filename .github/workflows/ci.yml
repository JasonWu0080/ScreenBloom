name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; no secrets are used by any job, so fork PRs run the same checks safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Type check · Lint · Unit tests · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build output contains notices, version and SEO files
        run: |
          for f in LICENSE.txt THIRD_PARTY_NOTICES.md version.json robots.txt sitemap.xml og-image.png favicon.ico; do
            test -s "out/$f" || { echo "missing out/$f" >&2; exit 1; }
          done
          node -e 'const v=require("./out/version.json"),p=require("./package.json"); if (v.version!==p.version || !/^[0-9a-f]{40}$/.test(v.commit)) { console.error(v); process.exit(1) }'


  e2e:
    name: End-to-end (Chrome)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The tests run in branded Google Chrome (H.264 decode/encode), plus Playwright's ffmpeg
      # for recording the synthetic sample videos.
      - run: npx playwright install --with-deps chrome ffmpeg
      - name: Generate sample videos
        run: npm run samples
      - run: npm run build
      - run: npm run e2e
      - name: Smoke test (same script that can check a deployment)
        run: npm run e2e:smoke
      - name: Upload e2e outputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: |
            test-results/
            samples/vfr-1280.mp4
          retention-days: 7

  # Large-input limit, timing and benchmark runs are slow and runner-dependent; on demand only.
  stress:
    name: Stress / limits / benchmark (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps chrome ffmpeg
      - run: node scripts/make-samples.mjs --stress
      - run: npm run build
      - run: npm run e2e:stress
      - name: GIF benchmark (informational; CI runners vary too much for a time limit)
        run: npm run bench
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark
          path: test-results/bench/
          retention-days: 30
